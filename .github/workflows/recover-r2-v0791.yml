name: recover-r2-v0791

# Remove this one-time entry after the verified recovery completes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-r2-v0791.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact release and completed publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify_r2_v0791_recovery.sh
      - name: Resume only R2 from verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: caelis-releases
        run: bash scripts/publish_latest_to_r2.sh v0.79.1
