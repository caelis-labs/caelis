name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archives without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish
      - name: Preserve unpublished archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unpublished-archives
          path: dist/caelis_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  notarize-darwin:
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    environment: default
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unpublished-archives
          path: dist
      - name: Sign and notarize both macOS CLIs before packaging
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/sign_notarize_cli.sh "${GITHUB_REF_NAME#v}" dist
      - name: Preserve Apple result and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-notarization-receipt
          path: dist/notarization/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve final release archives and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-archives
          path: |
            dist/caelis_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    needs: notarize-darwin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: default
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-archives
          path: dist
      - name: Verify final assets before any publication
        run: bash scripts/verify_release_archives.sh "${GITHUB_REF_NAME#v}" dist
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.10.0
          npm -v
      - name: Set package version from git tag
        run: node ./npm/scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Stage platform packages from final archives
        run: node ./npm/scripts/stage-release.mjs "${GITHUB_REF_NAME#v}" ./dist
      - name: Publish verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release_assets.sh "${GITHUB_REF_NAME}" dist
      - name: Publish platform packages
        run: >
          node ./npm/scripts/publish-release.mjs
          ./npm/packages/caelis-darwin-arm64
          ./npm/packages/caelis-darwin-x64
          ./npm/packages/caelis-linux-arm64
          ./npm/packages/caelis-linux-x64
          ./npm/packages/caelis-windows-arm64
          ./npm/packages/caelis-windows-x64
      - name: Publish main package
        run: node ./npm/scripts/publish-release.mjs ./npm

  publish-r2:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: caelis-releases
    steps:
      - uses: actions/checkout@v7
      - name: Publish latest raw-install assets to R2
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_latest_to_r2.sh
