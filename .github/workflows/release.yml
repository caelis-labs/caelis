name: release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: default
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@^11.10.0
          npm -v
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set package version from git tag
        run: node ./npm/scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - name: Stage platform packages
        run: node ./npm/scripts/stage-release.mjs "${GITHUB_REF_NAME#v}" ./dist
      - name: Publish platform packages
        run: >
          node ./npm/scripts/publish-release.mjs
          ./npm/packages/caelis-darwin-arm64
          ./npm/packages/caelis-darwin-x64
          ./npm/packages/caelis-linux-arm64
          ./npm/packages/caelis-linux-x64
          ./npm/packages/caelis-windows-arm64
          ./npm/packages/caelis-windows-x64
      - name: Publish main package
        run: node ./npm/scripts/publish-release.mjs ./npm

  publish-r2:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: caelis-releases
    steps:
      - uses: actions/checkout@v7
      - name: Publish latest raw-install assets to R2
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_latest_to_r2.sh
