name: quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test CI change classification
        run: node --test scripts/ci_scope.test.mjs
      - name: Inspect PR changes and release metadata
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci_scope.mjs
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.docs == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Check maintained documentation links
        if: steps.scope.outputs.docs == 'true'
        run: go run ./scripts/markdown_links

  govulncheck:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable vulnerabilities
        run: govulncheck -mode=source -scan=symbol ./...

  go-quality:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: ./...
          install-mode: goinstall

      - name: Test
        run: make test

      - name: Build
        run: make build

  quality:
    needs: [changes, govulncheck, go-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify all selected checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          VULN_RESULT: ${{ needs.govulncheck.result }}
          GO_RESULT: ${{ needs.go-quality.result }}
        run: bash scripts/ci_result.sh
