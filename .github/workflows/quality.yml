name: quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-ci-approval:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-ci
    steps:
      - name: Release CI approved
        run: echo "Release PR CI approved for this revision."

  govulncheck:
    needs: release-ci-approval
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - name: Check release CI approval
        shell: bash
        env:
          APPROVAL_RESULT: ${{ needs.release-ci-approval.result }}
        run: |
          case "${APPROVAL_RESULT}" in
            success|skipped) ;;
            *) echo "Release CI approval was rejected or cancelled." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable vulnerabilities
        run: govulncheck -mode=source -scan=symbol ./...

  go-quality:
    needs: release-ci-approval
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check release CI approval
        shell: bash
        env:
          APPROVAL_RESULT: ${{ needs.release-ci-approval.result }}
        run: |
          case "${APPROVAL_RESULT}" in
            success|skipped) ;;
            *) echo "Release CI approval was rejected or cancelled." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: ./...
          install-mode: goinstall

      - name: Test
        run: make test

      - name: Guardian and model invocation concurrency
        run: go test -race -count=1 -timeout=5m ./app/gatewayapp ./agent-sdk/model ./agent-sdk/session/... ./internal/kernel -run 'TestGuardian|TestApprovalReviewer|TestToolAvailability|TestInvocation|TestAutoReview|Test.*Fence|Test.*MutationGuard'

      - name: Build
        run: make build

  windows-host-open:
    needs: release-ci-approval
    if: always() && github.event_name != 'schedule'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly -p=2
    steps:
      - name: Check release CI approval
        shell: bash
        env:
          APPROVAL_RESULT: ${{ needs.release-ci-approval.result }}
        run: |
          case "${APPROVAL_RESULT}" in
            success|skipped) ;;
            *) echo "Release CI approval was rejected or cancelled." >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Windows platform checks
        shell: bash
        run: make windows-check
