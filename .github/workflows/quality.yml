name: quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check reachable vulnerabilities
        run: govulncheck -mode=source -scan=symbol ./...

  go-quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: ./...
          install-mode: goinstall

      - name: Test
        run: make test

      - name: Build
        run: make build

  windows-host-open:
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: ./...
          install-mode: goinstall

      - name: Test
        shell: bash
        env:
          GOFLAGS: -mod=readonly -p=2
        run: make test GO_TEST_TIMEOUT=15m

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: make build

      - name: Embedded Memory Open
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -timeout 10m ./app/gatewayapp/internal/memoryhost -run '^TestEmbeddedHostBindsSDKClient$'
