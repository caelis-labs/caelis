name: platform-checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source:
          - 297a74cf07352f9a1f6cf534758bdda8dc883e1b
          - c4c6df2d710357a3c77a6f24b743d5cf5114ddaa
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly -p=2
      CAELIS_TEST_APPLICATION_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Add diagnostics without changing assertions or production
        shell: bash
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: git show "${DIAGNOSTIC_SHA}:app/gatewayapp/execution_environment_approval_test.go" > app/gatewayapp/execution_environment_approval_test.go
      - name: Reproduce approval completion
        shell: bash
        run: go test ./app/gatewayapp -run '^TestApplicationExecutionEnvironmentAfterHostApproval$' -count=5 -v -timeout=8m
