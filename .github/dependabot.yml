version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Bound routine PR/CI volume; security updates have a separate queue.
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        # Keep ACP protocol changes in their own review and CI run.
        exclude-patterns: ['github.com/caelis-labs/acp-go-sdk']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Bound routine PR/CI volume; security updates have a separate queue.
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
